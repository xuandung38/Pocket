# Locket Dio — self-hosted stack.
#
# 3 services: api (backend REST + Socket.io) → no local DB, proxies Firebase;
# storage (media service → Cloudflare R2); and locket-love (Vite-preview
# frontend, the newest app by commit history — replaces the old web/lovekit).
#
# Quick start:
#   1. Copy each service's .env.example → .env.production and fill in secrets.
#   2. docker compose up -d --build
#
# All env_file entries are `required: false` so `docker compose build` / `config`
# work even before .env.production exists (they're gitignored). Fill them in
# before `up` or the services start with defaults only.
#
# Uploads are intentionally NOT persisted: the active post flow buffers media in
# the container's /tmp, transcodes, pushes to Cloudflare R2 (the real store),
# then deletes the temp file — nothing durable lives on the container FS.

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: locketdio-api
    env_file:
      - path: ./api/.env.production
        required: false
    environment:
      - NODE_ENV=production
    ports:
      - "5001:5001"
    networks:
      - locketdio
    # node:20-slim has no curl/wget — use the bundled node runtime to probe the
    # HTTP server. Any response (even 404) means the server is up → exit 0.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5001',r=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  storage:
    build:
      context: ./storage
      dockerfile: dockerfile
    container_name: locketdio-storage
    env_file:
      - path: ./storage/.env.production
        required: false
    environment:
      - NODE_ENV=production
      # Override the .env.production default (3005) so it matches the published port.
      - PORT=5003
    ports:
      - "5003:5003"
    networks:
      - locketdio
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5003',r=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # locket-love is the single frontend kept here — it's the newest codebase by
  # commit history (supersedes the older `web` and `lovekit` apps). It lives one
  # level up at apps/locket-love (sibling to apps/self-hosted).
  # Container listens on 5175 internally (Vite preview default — see Dockerfile CMD);
  # host 8176 is off Vite's dev default so a local `npm run dev` can run alongside.
  # .env.production is gitignored and may not exist — create one from
  # apps/locket-love/.env.example before `docker compose up` if you need to
  # override VITE_* build defaults.
  locket-love:
    build:
      context: ../locket-love
      dockerfile: Dockerfile
    container_name: locket-love-pwa
    env_file:
      - path: ../locket-love/.env.production
        required: false
    environment:
      - NODE_ENV=production
    ports:
      - "8176:5175"
    networks:
      - locketdio
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

# Dedicated bridge network so services resolve each other by name
# (api, storage, web, …) and stay isolated from other Compose projects.
networks:
  locketdio:
    driver: bridge
