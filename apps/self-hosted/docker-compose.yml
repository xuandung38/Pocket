services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: locketdio-api
    env_file:
      - ./api/.env.production
    environment:
      - NODE_ENV=production
    ports:
      - "5001:5001"
    restart: unless-stopped

  storage:
    build:
      context: ./storage
      dockerfile: dockerfile
    container_name: locketdio-storage
    env_file:
      - ./storage/.env.production
    environment:
      - NODE_ENV=production
      - PORT=5003
    ports:
      - "5003:5003"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: locketdio-web
    env_file:
      - ./web/.env.production
    environment:
      - NODE_ENV=production
    ports:
      - "5173:5173"
    depends_on:
      - api
      - storage
    restart: unless-stopped

  lovekit:
    build:
      context: ./lovekit
      dockerfile: Dockerfile
    container_name: lovekit-pwa
    env_file:
      - ./lovekit/.env.production
    environment:
      - NODE_ENV=production
    ports:
      - "5175:5175"
    depends_on:
      - api
    restart: unless-stopped

  # locket-love sits one level up at apps/locket-love (sibling to apps/self-hosted).
  # Host port 5176 avoids collision with lovekit on 5175; container still listens
  # on 5175 internally (Vite preview default — see Dockerfile CMD).
  # env_file is `required: false` so `docker compose build` works pre-deploy
  # without a .env.production checked in (it's gitignored). Create one from
  # apps/locket-love/.env.example before `docker compose up`.
  locket-love:
    build:
      context: ../locket-love
      dockerfile: Dockerfile
    container_name: locket-love-pwa
    env_file:
      - path: ../locket-love/.env.production
        required: false
    environment:
      - NODE_ENV=production
    ports:
      - "5176:5175"
    depends_on:
      - api
    restart: unless-stopped
